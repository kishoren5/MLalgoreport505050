apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: next-word-predictor-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: next-word-predictor-service
            port:
              number: 80
