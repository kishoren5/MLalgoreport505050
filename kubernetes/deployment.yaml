apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-word-predictor
  namespace: default
  labels:
    app: next-word-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: next-word-predictor
  template:
    metadata:
      labels:
        app: next-word-predictor
    spec:
      containers:
      - name: next-word-predictor
        image: kishoren5/next-word-predictor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          limits:
            cpu: "1.0"
            memory: "2Gi"
          requests:
            cpu: "0.5"
            memory: "1Gi"
        env:
        - name: PORT
          value: "5000"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
